<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Deportiva ITSON · Componentes</title>
  <link rel="stylesheet" href="/src/estilos.css">
</head>

<body>

  <header class="encabezado">
    <div class="encabezado__marca">
      <img src="/img/logo.svg" alt="" height="34">
      <span>ITSON</span>
    </div>

    <div class="encabezado__carrito">
      <span>Carrito: <strong id="cuenta">0</strong></span>
      <boton-app variante="peligro" id="vaciar">Vaciar</boton-app>
    </div>
  </header>

  <main class="contenido">
    <section class="portada">
      <h1>Catálogo de temporada</h1>
      <p>Doce productos. Una sola tarjeta escrita una vez.</p>
    </section>

    <!-- Paso 2: aquí va la rejilla de tarjetas -->
    <section class="rejilla" id="rejilla" aria-label="Productos"></section>

    <!-- Tarea: aquí pueden montar sus dos componentes nuevos. -->
    <section class="tarea" id="tarea"></section>
    <!-- Variante por defecto (usa la clase 'primario' automáticamente) -->
    <boton-app>Boton Primario</boton-app>

    <!-- Variante secundaria -->
    <boton-app variante="secundario">Boton Secundario</boton-app>

    <!-- Variante de peligro -->
    <boton-app variante="peligro">Boton Peligro</boton-app>

    <!-- Botón deshabilitado -->
    <boton-app deshabilitado>Botón Deshabilitado</boton-app>

    <!-- Botón con variante y deshabilitado al mismo tiempo -->
    <boton-app variante="secundario" deshabilitado>Secundario Deshabilitado</boton-app>
  </main>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
